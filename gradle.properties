# Done to increase the memory available to gradle.
# Fix for JDK 21 Unix domain socket bug on Windows (PipeImpl fails with long TEMP paths)
org.gradle.jvmargs=-Xmx1G -Djava.net.preferIPv4Stack=true -Djava.io.tmpdir=C:/TMP
# Minecraft 1.21.11 + Sodium работают ТОЛЬКО на Java 21. На Java 25 ломается:
# netty теряет sun.misc.Unsafe, Mixin отклоняет миксины Sodium, клиент даёт
# пустой кадр. Держим Gradle (и значит runClient) на 21.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.5
loader_version=0.19.2
# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=ru.decide
archives_base_name=decide
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.141.3+1.21.11

# Локальные runtime-либы (плоские jar в libs/)
media_player_info_version=0.1.0
kotlin_version=1.9.20
kotlinx_serialization_version=1.6.3
# Превью содержимого шалкеров/сундуков при наведении на предмет в инвентаре.
# В own jar через Loom include (bundle_libs_in_jar), отдельный мод не нужен.
shulkerboxtooltip_version=5.2.16

# true  = media-player-info + kotlin внутри mod jar (jar-in-jar через Loom include)
# false = либы отдельно (compileOnly + modLocalRuntime, копируются в mods/)
bundle_libs_in_jar=true
